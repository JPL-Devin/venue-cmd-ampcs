openapi: 3.1.0
info:
  title: Ingenium VenueServer
  description: RESTful API of Ingenium VenueServer that interfaces with test venues
  version: 14.1-TP
paths:
  /api/v3/health:
    get:
      tags:
      - HEALTH
      summary: Check health status of VenueServer
      operationId: health_api_v3_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/mtak/start:
    post:
      tags:
      - MTAK
      summary: Start MTAK on the venue GDS host for the specified AMPCS session ids
      operationId: start_mtak_api_v3_mtak_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MtakStartBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MtakStartResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/mtak/shutdown:
    post:
      tags:
      - MTAK
      summary: Shutdown MTAK that was started by VenueServer
      operationId: shutdown_mtak_api_v3_mtak_shutdown_post
      responses:
        '204':
          description: Successful Response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/cmd/fsw_cmd:
    post:
      tags:
      - COMMAND
      summary: Send a FSW command via MTAK
      operationId: fsw_cmd_api_v3_cmd_fsw_cmd_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FswCmdBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/cmd/hw_cmd:
    post:
      tags:
      - COMMAND
      summary: Send a HW command via MTAK
      operationId: hw_cmd_api_v3_cmd_hw_cmd_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HwCmdBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/cmd/sse:
    post:
      tags:
      - COMMAND
      summary: Send a SSE command via MTAK
      description: Send a SSE (Simulation and Support Equipment) command via MTAK
      operationId: sse_cmd_api_v3_cmd_sse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SseCmdBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/cmd/binary_file:
    post:
      tags:
      - COMMAND
      summary: Upload a file to flight computer via MTAK
      operationId: binary_file_api_v3_cmd_binary_file_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BinaryFileBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/cmd/scmf:
    post:
      tags:
      - COMMAND
      summary: Upload a SCMF file to flight
      operationId: scmf_file_api_v3_cmd_scmf_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScmfFileBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/evr/realtime:
    get:
      tags:
      - EVR
      summary: Queries the real time EVR stream for the specified EVRs. This supports
        querying multiple EVR names, etc.
      description: Queries the AMPCS Global LAD and return an array of EVR objects
      operationId: evr_realtime_multi_api_v3_evr_realtime_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvrRtMultiBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EVRObjectResp'
                title: Response Evr Realtime Multi Api V3 Evr Realtime Get
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v3/eha/realtime:
    get:
      tags:
      - EHA
      summary: Queries the real time telemetry stream for a given channel. This supports
        querying multiple channel ids, etc.
      description: Queries AMPCS Global LAD and return an array of EHA channel objects
      operationId: eha_realtime_multi_api_v3_eha_realtime_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EhaRtMultiBodyModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelValueObjectRespModel'
                title: Response Eha Realtime Multi Api V3 Eha Realtime Get
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ChannelValueObjectRespModel:
      properties:
        dn:
          type: string
          title: Dn
          description: Data number value. Only returns string for now
          default: ''
        eu:
          type: number
          title: Eu
          description: Engineering unit value
          default: 0.0
        channelId:
          type: string
          title: Channelid
          description: The Id of the EHA channel
          default: ''
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session ID that the result came from
          default: 0
        vcId:
          type: integer
          title: Vcid
          description: The virtual channel ID that the result came from
          default: 0
        channelName:
          type: string
          title: Channelname
          description: The name of the EHA channel
          default: ''
        channelType:
          type: string
          title: Channeltype
          description: The type of the EHA channel
          default: ''
        channelStatus:
          type: string
          title: Channelstatus
          description: The string status of the channel if it is a table-driven channel
            (only for boolean and status type channels)
          default: ''
        sclk:
          type: string
          title: Sclk
          description: SCLK when this value was read
          default: ''
        ert:
          type: string
          title: Ert
          description: Earth received (ISO-formatted) time when this value was received
          default: ''
        scet:
          type: string
          title: Scet
          description: Correlated SCLK time in ISO format
          default: ''
        isRecorded:
          type: boolean
          title: Isrecorded
          description: True if this is a recorded EHA, false otherwise
          default: false
        dnAlarmState:
          type: string
          title: Dnalarmstate
          description: Indicates if the channel measurement is in alarm (on DN values)
          default: ''
        euAlarmState:
          type: string
          title: Eualarmstate
          description: Indicates if the channel measurement is in alarm (on EU values)
          default: ''
      type: object
      title: ChannelValueObjectRespModel
    BinaryFileBodyModel:
      properties:
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session to send the command through
        sourceFilePath:
          type: string
          title: Sourcefilepath
          description: 'The full path on GDS host (ex: /proj/europa/sit/current/files/myfile.data)'
        targetFilePath:
          type: string
          title: Targetfilepath
          description: The full onboard path (i.e. /eng1/myfile.data
        overwrite:
          type: boolean
          title: Overwrite
          description: if True will overwrite any existing onboard file
          default: true
        fileType:
          type: integer
          title: Filetype
          description: The file type that should be used to build the binary file
            into a SCMF
        stringSelection:
          allOf:
          - $ref: '#/components/schemas/StringSelection'
          description: Specifies the MTAK string to send the command
          default: DEFAULT
        timeout:
          type: integer
          minimum: 0.0
          title: Timeout
          description: The timeout on the dispatch process in seconds
          default: 10
      type: object
      required:
      - sessionId
      - sourceFilePath
      - targetFilePath
      - fileType
      title: BinaryFileBodyModel
    CmdDispatchedResp:
      properties:
        cmdRequested:
          type: string
          title: Cmdrequested
          description: This mirrors what was received as the requested command string
          default: ''
        dispatchTime:
          type: string
          title: Dispatchtime
          description: 'Time that the dispatch occurred. Example: 2017-09-25T03:57:42.676Z'
          default: ''
      type: object
      title: CmdDispatchedResp
    EVRObjectResp:
      properties:
        evrName:
          type: string
          title: Evrname
          description: Name of the EVR
          default: ''
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session ID
          default: 0
        vcId:
          type: integer
          title: Vcid
          description: The virtual channel ID
          default: 0
        eventId:
          type: integer
          title: Eventid
          description: EVR event ID
          default: 0
        evrLevel:
          type: string
          title: Evrlevel
          description: Level of EVR
          default: ''
        fromSSE:
          type: boolean
          title: Fromsse
          description: True if EVR is frome SSE, false otherwise
          default: false
        evrMessage:
          type: string
          title: Evrmessage
          description: Message that this EVR contains
          default: ''
        evrModule:
          type: string
          title: Evrmodule
          description: FSW module that generated this EVR
          default: ''
        sclk:
          type: string
          title: Sclk
          description: SCLK for this EVR
          default: ''
        ert:
          type: string
          title: Ert
          description: Earth received (ISO-formatted) time
          default: ''
        scet:
          type: string
          title: Scet
          description: ISO-formatted spacecraft event time
          default: ''
        isRecorded:
          type: boolean
          title: Isrecorded
          description: True if this is a recorded EVR (from data products)
          default: false
      type: object
      title: EVRObjectResp
    EhaRtMultiBodyModel:
      properties:
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sessionid
          description: The AMPCS session to query against
        channelIds:
          items:
            type: string
          type: array
          title: Channelids
          description: The channel IDs to search for
        startTime:
          type: string
          title: Starttime
          description: Query start time in ERT DOY UTC (2009-202T12:35:00)
        endTime:
          type: string
          title: Endtime
          description: Query end time in ERT DOY UTC (2009-202T12:35:00)
        timeout:
          type: integer
          minimum: 0.0
          title: Timeout
          description: How long to wait in seconds for results to return
          default: 240
      type: object
      required:
      - channelIds
      - startTime
      - endTime
      title: EhaRtMultiBodyModel
    EvrRtMultiBodyModel:
      properties:
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session to qury against
        evrNames:
          items:
            type: string
          type: array
          title: Evrnames
          description: Name of EVRs to retrieve. No wildcard is supported
          default: []
        eventIds:
          items:
            type: integer
          type: array
          title: Eventids
          description: Event IDs of EVRs to retreive
          default: []
        evrLevels:
          items:
            type: string
          type: array
          title: Evrlevels
          description: Levels of EVRs to return. Note that levels are project specific.
          default: []
        startTime:
          type: string
          title: Starttime
          description: Query start time in ERT DOY UTC (2009-202T12:35:00)
        endTime:
          type: string
          title: Endtime
          description: Query end time in ERT DOY UTC (2009-202T12:35:00)
        timeout:
          type: integer
          minimum: 0.0
          title: Timeout
          description: How long to wait in seconds for results to return
          default: 240
      type: object
      required:
      - sessionId
      - startTime
      - endTime
      title: EvrRtMultiBodyModel
    DefaultCmdString:
      type: string
      enum:
      - A
      - B
      - AB
      title: DefaultCmdString
      description: An enumeration.
    ErrorResponse:
      properties:
        message:
          type: string
          title: Message
          description: Error message
          default: ''
      type: object
      title: ErrorResponse
    FswCmdBodyModel:
      properties:
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session to send the command through
        commandString:
          type: string
          title: Commandstring
          description: The command string including the command stem and any arguments
        validate:
          type: boolean
          title: Validate
          description: Flag for AMPCS to validate the command against the FSW dict
            before radiating
          default: true
        stringSelection:
          allOf:
          - $ref: '#/components/schemas/StringSelection'
          description: Which sides of flight computer the command is for
          default: DEFAULT
        timeout:
          type: integer
          minimum: 0.0
          title: Timeout
          description: The timeout on the dispatch process in seconds
          default: 10
      type: object
      required:
      - sessionId
      - commandString
      title: FswCmdBodyModel
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthStatus:
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/HealthStatusEnum'
          description: health status
        message:
          type: string
          title: Message
          description: status message
      type: object
      required:
      - status
      - message
      title: HealthStatus
    HealthStatusEnum:
      type: string
      enum:
      - OK
      - ERROR
      - UNKNOWN
      title: HealthStatusEnum
      description: An enumeration.
    HwCmdBodyModel:
      properties:
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session to send this file through
        commandStem:
          type: string
          title: Commandstem
          description: The command stem of the HW Command
        stringSelection:
          allOf:
          - $ref: '#/components/schemas/StringSelection'
          description: Specifies the MTAK string to send the command
          default: DEFAULT
        timeout:
          type: integer
          minimum: 0.0
          title: Timeout
          description: The timeout on the dispatch process in seconds
          default: 10
      type: object
      required:
      - sessionId
      - commandStem
      title: HwCmdBodyModel
    MtakStartBodyModel:
      properties:
        sessionIds:
          items:
            type: integer
          type: array
          title: Sessionids
          description: AMPCS session ids to start MTAK on
        timeout:
          type: integer
          minimum: 25.0
          title: Timeout
          description: How long to wait until timeout in seconds. The minimum is 25
            seconds since MTAK takes some time to start
          default: 30
        defaultCmdString:
          allOf:
          - $ref: '#/components/schemas/DefaultCmdString'
          description: Which sides of flight computer the command is for. This will
            be used if default is used for stringSelection.
          default: AB
      type: object
      required:
      - sessionIds
      title: MtakStartBodyModel
    MtakStartResponse:
      properties:
        sessionIds:
          items:
            type: integer
          type: array
          title: Sessionids
          description: AMPCS session ids
        startTime:
          type: string
          title: Starttime
          description: Time that MTAK started
      type: object
      required:
      - sessionIds
      - startTime
      title: MtakStartResponse
    ScmfFileBodyModel:
      properties:
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session to send the command through
        filePath:
          type: string
          title: Filepath
          description: 'The full path on GDS host (ex: /proj/europa/sit/current/files/myfile.scmf)'
        disableChecks:
          type: boolean
          title: Disablechecks
          description: Disables the check done by AMPCS for invalid scmf file
          default: false
        timeout:
          type: integer
          minimum: 0.0
          title: Timeout
          description: The timeout on the dispatch process in seconds
          default: 10
      type: object
      required:
      - sessionId
      - filePath
      title: ScmfFileBodyModel
    SseCmdBodyModel:
      properties:
        sessionId:
          type: integer
          title: Sessionid
          description: The AMPCS session to send the command through
        commandString:
          type: string
          title: Commandstring
          description: The command string including the command stem and any arguments
        timeout:
          type: integer
          minimum: 0.0
          title: Timeout
          description: The timeout on the dispatch process in seconds
          default: 10
      type: object
      required:
      - sessionId
      - commandString
      title: SseCmdBodyModel
    StringSelection:
      type: string
      enum:
      - DEFAULT
      - A
      - B
      - AB
      title: StringSelection
      description: An enumeration.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TimeType:
      type: string
      enum:
      - ERT
      - SCET
      - SCLK
      title: TimeType
      description: An enumeration.
tags:
- name: MTAK
  description: Start or stop MTAK sessions
- name: COMMAND
  description: Send commands
- name: EVR
  description: Query realtime EVR telemetry
- name: EHA
  description: Query realtime EHA telemetry
- name: HEALTH
  description: Check service health
