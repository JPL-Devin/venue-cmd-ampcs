components:
  schemas:
    BinaryFileBodyModel:
      properties:
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        fileType:
          description: The file type that should be used to build the binary file
            into a SCMF
          title: Filetype
          type: integer
        overwrite:
          default: true
          description: if True will overwrite any existing onboard file
          title: Overwrite
          type: boolean
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session to send the command through
          title: Sessionid
        sourceFilePath:
          description: 'The full path on GDS host (ex: /proj/europa/sit/current/files/myfile.data)'
          title: Sourcefilepath
          type: string
        stringSelection:
          $ref: '#/components/schemas/StringSelection'
          default: DEFAULT
          description: Specifies the MTAK string to send the command
        targetFilePath:
          description: The full onboard path (i.e. /eng1/myfile.data
          title: Targetfilepath
          type: string
        timeout:
          default: 10
          description: The timeout on the dispatch process in seconds
          minimum: 0.0
          title: Timeout
          type: integer
      required:
      - sourceFilePath
      - targetFilePath
      - fileType
      title: BinaryFileBodyModel
      type: object
    ChannelValueObjectRespModel:
      properties:
        channelId:
          default: ''
          description: The Id of the EHA channel
          title: Channelid
          type: string
        channelName:
          default: ''
          description: The name of the EHA channel
          title: Channelname
          type: string
        channelStatus:
          default: ''
          description: The string status of the channel if it is a table-driven channel
            (only for boolean and status type channels)
          title: Channelstatus
          type: string
        channelType:
          default: ''
          description: The type of the EHA channel
          title: Channeltype
          type: string
        dn:
          default: ''
          description: Data number value. Only returns string for now
          title: Dn
          type: string
        dnAlarmState:
          default: ''
          description: Indicates if the channel measurement is in alarm (on DN values)
          title: Dnalarmstate
          type: string
        ert:
          default: ''
          description: Earth received (ISO-formatted) time when this value was received
          title: Ert
          type: string
        eu:
          default: 0.0
          description: Engineering unit value
          title: Eu
          type: number
        euAlarmState:
          default: ''
          description: Indicates if the channel measurement is in alarm (on EU values)
          title: Eualarmstate
          type: string
        isRecorded:
          default: false
          description: True if this is a recorded EHA, false otherwise
          title: Isrecorded
          type: boolean
        scet:
          default: ''
          description: Correlated SCLK time in ISO format
          title: Scet
          type: string
        sclk:
          default: ''
          description: SCLK when this value was read
          title: Sclk
          type: string
        sessionId:
          default: 0
          description: The AMPCS session ID that the result came from
          title: Sessionid
          type: integer
        vcId:
          default: 0
          description: The virtual channel ID that the result came from
          title: Vcid
          type: integer
      title: ChannelValueObjectRespModel
      type: object
    CmdDispatchedResp:
      properties:
        cmdRequested:
          default: ''
          description: This mirrors what was received as the requested command string
          title: Cmdrequested
          type: string
        dispatchTime:
          default: ''
          description: 'Time that the dispatch occurred. Example: 2017-09-25T03:57:42.676Z'
          title: Dispatchtime
          type: string
      title: CmdDispatchedResp
      type: object
    DataPathMappingModel:
      properties:
        dataPath:
          description: A user-defined string alias for an AMPCS session
          title: Datapath
          type: string
        sessionId:
          description: The AMPCS session ID
          title: Sessionid
          type: integer
      required:
      - dataPath
      - sessionId
      title: DataPathMappingModel
      type: object
    DefaultCmdString:
      enum:
      - A
      - B
      - AB
      title: DefaultCmdString
      type: string
    EVRObjectResp:
      properties:
        ert:
          default: ''
          description: Earth received (ISO-formatted) time
          title: Ert
          type: string
        eventId:
          default: 0
          description: EVR event ID
          title: Eventid
          type: integer
        evrLevel:
          default: ''
          description: Level of EVR
          title: Evrlevel
          type: string
        evrMessage:
          default: ''
          description: Message that this EVR contains
          title: Evrmessage
          type: string
        evrModule:
          default: ''
          description: FSW module that generated this EVR
          title: Evrmodule
          type: string
        evrName:
          default: ''
          description: Name of the EVR
          title: Evrname
          type: string
        fromSSE:
          default: false
          description: True if EVR is frome SSE, false otherwise
          title: Fromsse
          type: boolean
        isRecorded:
          default: false
          description: True if this is a recorded EVR (from data products)
          title: Isrecorded
          type: boolean
        scet:
          default: ''
          description: ISO-formatted spacecraft event time
          title: Scet
          type: string
        sclk:
          default: ''
          description: SCLK for this EVR
          title: Sclk
          type: string
        sessionId:
          default: 0
          description: The AMPCS session ID
          title: Sessionid
          type: integer
        vcId:
          default: 0
          description: The virtual channel ID
          title: Vcid
          type: integer
      title: EVRObjectResp
      type: object
    EhaRtMultiBodyModel:
      properties:
        channelIds:
          description: The channel IDs to search for
          items:
            type: string
          title: Channelids
          type: array
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        endTime:
          description: Query end time in ERT DOY UTC (2009-202T12:35:00)
          title: Endtime
          type: string
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session to query against
          title: Sessionid
        startTime:
          description: Query start time in ERT DOY UTC (2009-202T12:35:00)
          title: Starttime
          type: string
        timeout:
          default: 240
          description: How long to wait in seconds for results to return
          minimum: 0.0
          title: Timeout
          type: integer
      required:
      - channelIds
      - startTime
      - endTime
      title: EhaRtMultiBodyModel
      type: object
    ErrorResponse:
      properties:
        message:
          default: ''
          description: Error message
          title: Message
          type: string
      title: ErrorResponse
      type: object
    EvrRtMultiBodyModel:
      properties:
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        endTime:
          description: Query end time in ERT DOY UTC (2009-202T12:35:00)
          title: Endtime
          type: string
        eventIds:
          default: []
          description: Event IDs of EVRs to retreive
          items:
            type: integer
          title: Eventids
          type: array
        evrLevels:
          default: []
          description: Levels of EVRs to return. Note that levels are project specific.
          items:
            type: string
          title: Evrlevels
          type: array
        evrNames:
          default: []
          description: Name of EVRs to retrieve. No wildcard is supported
          items:
            type: string
          title: Evrnames
          type: array
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session to qury against
          title: Sessionid
        startTime:
          description: Query start time in ERT DOY UTC (2009-202T12:35:00)
          title: Starttime
          type: string
        timeout:
          default: 240
          description: How long to wait in seconds for results to return
          minimum: 0.0
          title: Timeout
          type: integer
      required:
      - startTime
      - endTime
      title: EvrRtMultiBodyModel
      type: object
    FswCmdBodyModel:
      properties:
        commandString:
          description: The command string including the command stem and any arguments
          title: Commandstring
          type: string
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session to send the command through
          title: Sessionid
        stringSelection:
          $ref: '#/components/schemas/StringSelection'
          default: DEFAULT
          description: Which sides of flight computer the command is for
        timeout:
          default: 10
          description: The timeout on the dispatch process in seconds
          minimum: 0.0
          title: Timeout
          type: integer
        validate:
          default: true
          description: Flag for AMPCS to validate the command against the FSW dict
            before radiating
          title: Validate
          type: boolean
      required:
      - commandString
      title: FswCmdBodyModel
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthStatus:
      properties:
        message:
          description: status message
          title: Message
          type: string
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
          description: health status
      required:
      - status
      - message
      title: HealthStatus
      type: object
    HealthStatusEnum:
      enum:
      - OK
      - ERROR
      - UNKNOWN
      title: HealthStatusEnum
      type: string
    HwCmdBodyModel:
      properties:
        commandStem:
          description: The command stem of the HW Command
          title: Commandstem
          type: string
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session to send this file through
          title: Sessionid
        stringSelection:
          $ref: '#/components/schemas/StringSelection'
          default: DEFAULT
          description: Specifies the MTAK string to send the command
        timeout:
          default: 10
          description: The timeout on the dispatch process in seconds
          minimum: 0.0
          title: Timeout
          type: integer
      required:
      - commandStem
      title: HwCmdBodyModel
      type: object
    MtakSessionEntry:
      properties:
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session ID
          title: Sessionid
      title: MtakSessionEntry
      type: object
    MtakStartBodyModel:
      properties:
        defaultCmdString:
          $ref: '#/components/schemas/DefaultCmdString'
          default: AB
          description: Which sides of flight computer the command is for. Applied
            uniformly to all sessions.
        sessions:
          description: List of sessions to start MTAK on
          items:
            $ref: '#/components/schemas/MtakSessionEntry'
          title: Sessions
          type: array
        timeout:
          default: 30
          description: How long to wait until timeout in seconds. The minimum is 25
            seconds since MTAK takes some time to start
          minimum: 25.0
          title: Timeout
          type: integer
      required:
      - sessions
      title: MtakStartBodyModel
      type: object
    MtakStartResponse:
      properties:
        sessionIds:
          description: AMPCS session ids
          items:
            type: integer
          title: Sessionids
          type: array
        startTime:
          description: Time that MTAK started
          title: Starttime
          type: string
      required:
      - sessionIds
      - startTime
      title: MtakStartResponse
      type: object
    ScmfFileBodyModel:
      properties:
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        disableChecks:
          default: false
          description: Disables the check done by AMPCS for invalid scmf file
          title: Disablechecks
          type: boolean
        filePath:
          description: 'The full path on GDS host (ex: /proj/europa/sit/current/files/myfile.scmf)'
          title: Filepath
          type: string
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session to send the command through
          title: Sessionid
        timeout:
          default: 10
          description: The timeout on the dispatch process in seconds
          minimum: 0.0
          title: Timeout
          type: integer
      required:
      - filePath
      title: ScmfFileBodyModel
      type: object
    SseCmdBodyModel:
      properties:
        commandString:
          description: The command string including the command stem and any arguments
          title: Commandstring
          type: string
        dataPath:
          anyOf:
          - type: string
          - type: 'null'
          description: DataPath alias for an AMPCS session
          title: Datapath
        sessionId:
          anyOf:
          - type: integer
          - type: 'null'
          description: The AMPCS session to send the command through
          title: Sessionid
        timeout:
          default: 10
          description: The timeout on the dispatch process in seconds
          minimum: 0.0
          title: Timeout
          type: integer
      required:
      - commandString
      title: SseCmdBodyModel
      type: object
    StringSelection:
      enum:
      - DEFAULT
      - A
      - B
      - AB
      title: StringSelection
      type: string
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: RESTful API of Ingenium VenueServer that interfaces with test venues
  title: Ingenium VenueServer
  version: 14.1-TP
openapi: 3.1.0
paths:
  /api/v3/cmd/binary_file:
    post:
      operationId: binary_file_api_v3_cmd_binary_file_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BinaryFileBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Upload a file to flight computer via MTAK
      tags:
      - COMMAND
  /api/v3/cmd/fsw_cmd:
    post:
      operationId: fsw_cmd_api_v3_cmd_fsw_cmd_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FswCmdBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Send a FSW command via MTAK
      tags:
      - COMMAND
  /api/v3/cmd/hw_cmd:
    post:
      operationId: hw_cmd_api_v3_cmd_hw_cmd_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HwCmdBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Send a HW command via MTAK
      tags:
      - COMMAND
  /api/v3/cmd/scmf:
    post:
      operationId: scmf_file_api_v3_cmd_scmf_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScmfFileBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Upload a SCMF file to flight
      tags:
      - COMMAND
  /api/v3/cmd/sse:
    post:
      description: Send a SSE (Simulation and Support Equipment) command via MTAK
      operationId: sse_cmd_api_v3_cmd_sse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SseCmdBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdDispatchedResp'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Send a SSE command via MTAK
      tags:
      - COMMAND
  /api/v3/datapath:
    post:
      operationId: create_datapath_api_v3_datapath_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataPathMappingModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPathMappingModel'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Create or update a DataPath alias for an AMPCS sessionId
      tags:
      - DATA_PATH
  /api/v3/datapath/{data_path}:
    delete:
      operationId: delete_datapath_api_v3_datapath__data_path__delete
      parameters:
      - in: path
        name: data_path
        required: true
        schema:
          title: Data Path
          type: string
      responses:
        '204':
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Delete a DataPath alias
      tags:
      - DATA_PATH
    get:
      operationId: get_datapath_api_v3_datapath__data_path__get
      parameters:
      - in: path
        name: data_path
        required: true
        schema:
          title: Data Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPathMappingModel'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Look up the AMPCS sessionId for a DataPath alias
      tags:
      - DATA_PATH
  /api/v3/eha/realtime:
    get:
      description: Queries AMPCS Global LAD and return an array of EHA channel objects
      operationId: eha_realtime_multi_api_v3_eha_realtime_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EhaRtMultiBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChannelValueObjectRespModel'
                title: Response 200 Eha Realtime Multi Api V3 Eha Realtime Get
                type: array
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Queries the real time telemetry stream for a given channel. This supports
        querying multiple channel ids, etc.
      tags:
      - EHA
  /api/v3/evr/realtime:
    get:
      description: Queries the AMPCS Global LAD and return an array of EVR objects
      operationId: evr_realtime_multi_api_v3_evr_realtime_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvrRtMultiBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EVRObjectResp'
                title: Response 200 Evr Realtime Multi Api V3 Evr Realtime Get
                type: array
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Queries the real time EVR stream for the specified EVRs. This supports
        querying multiple EVR names, etc.
      tags:
      - EVR
  /api/v3/health:
    get:
      operationId: health_api_v3_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Check health status of VenueServer
      tags:
      - HEALTH
  /api/v3/mtak/shutdown:
    post:
      operationId: shutdown_mtak_api_v3_mtak_shutdown_post
      responses:
        '204':
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Shutdown MTAK that was started by VenueServer
      tags:
      - MTAK
  /api/v3/mtak/start:
    post:
      operationId: start_mtak_api_v3_mtak_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MtakStartBodyModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MtakStartResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      summary: Start MTAK on the venue GDS host for the specified AMPCS session ids
      tags:
      - MTAK
tags:
- description: Start or stop MTAK sessions
  name: MTAK
- description: Send commands
  name: COMMAND
- description: Query realtime EVR telemetry
  name: EVR
- description: Query realtime EHA telemetry
  name: EHA
- description: Manage DataPath to SessionId mappings
  name: DATA_PATH
- description: Check service health
  name: HEALTH
